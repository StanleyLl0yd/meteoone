name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Verify canonical app icon
        run: python3 scripts/verify_app_icon.py

      - name: Verify location privacy boundary
        run: python3 scripts/verify_location_privacy.py

      - name: Verify app localization parity
        run: python3 scripts/verify_app_localization.py

      - name: Verify vendored GRIB native bundle
        run: python3 scripts/verify_forecast_data_native_bundle.py

      - name: Verify release secret policy
        run: python3 scripts/verify_release_secret_policy.py

      - name: Verify application release metadata
        run: python3 scripts/verify_release_metadata.py

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Install Android SDK packages
        run: android sdk install platforms/android-37.0 build-tools/37.0.0

      - name: Repository policy unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Forecast benchmark unit tests
        run: python -m unittest discover -s research/forecast_benchmark/tests -v

      - name: GRIB capability unit tests
        run: python -m unittest discover -s research/grib_capabilities/tests -v

      - name: GRIB decoder candidate unit tests
        run: |
          bash -n research/grib_decoder_candidates/build_android_runtime_bundle.sh
          bash -n research/grib_decoder_candidates/run_android_runtime_smoke.sh
          bash -n research/grib_decoder_candidates/run_production_jni_corpus_regression.sh
          rm -rf "$RUNNER_TEMP/production-jni-regression-classes"
          javac -d "$RUNNER_TEMP/production-jni-regression-classes" \
            research/grib_decoder_candidates/production_jni/ProductionJniCorpusRegression.java
          python -m unittest discover -s research/grib_decoder_candidates/tests -v

      - name: Verify
        run: >-
          ./gradlew
          --no-daemon
          --stacktrace
          :core:model:test
          :core:network:test
          :core:location:testDebugUnitTest
          :core:location:lintDebug
          :core:database:testDebugUnitTest
          :core:database:lintDebug
          :core:database:assembleDebug
          :core:preferences:testDebugUnitTest
          :core:preferences:lintDebug
          :core:preferences:assembleDebug
          :forecast:domain:test
          :forecast:openmeteo:test
          :forecast:data:testDebugUnitTest
          :forecast:data:lintDebug
          :forecast:data:assembleDebug
          :forecast:repository:testDebugUnitTest
          :forecast:repository:lintDebug
          :forecast:repository:assembleDebug
          :verification:domain:test
          :backend:gateway:test
          :backend:contract:test
          :backend:provider-gateway:test
          :backend:provider-adapters:test
          :verification:data:test
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:bundleRelease

      - name: Verify Room schema is committed
        run: |
          set -euo pipefail
          dirty=0
          if ! git diff --exit-code -- core/database/schemas; then
            dirty=1
          fi
          mapfile -t untracked < <(
            git ls-files --others --exclude-standard -- core/database/schemas
          )
          if ((${#untracked[@]})); then
            printf 'Untracked Room schema files:\n'
            printf '  %s\n' "${untracked[@]}"
            for file in "${untracked[@]}"; do
              echo "::group::$file"
              cat "$file"
              echo "::endgroup::"
            done
            dirty=1
          fi
          if ((dirty)); then
            echo "Room schema output differs from the committed schema set." >&2
            exit 1
          fi

      - name: Verify forecast data native AAR
        run: >-
          python3 scripts/verify_forecast_data_native_bundle.py
          --aar forecast/data/build/outputs/aar/data-debug.aar

      - name: Verify release JNI R8 boundary
        run: >-
          python3 scripts/verify_release_jni_r8.py
          --aar forecast/data/build/outputs/aar/data-debug.aar
          --mapping app/build/outputs/mapping/release/mapping.txt
