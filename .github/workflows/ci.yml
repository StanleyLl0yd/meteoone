name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Verify canonical app icon
        run: python3 scripts/verify_app_icon.py

      - name: Verify location privacy boundary
        run: python3 scripts/verify_location_privacy.py

      - name: Verify application identity
        run: |
          set -euo pipefail
          namespace="$(sed -n 's/^[[:space:]]*namespace = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          application_id="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test "$namespace" = "com.sl.meteoone"
          test "$application_id" = "com.sl.meteoone"

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: 15859902

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Install Android SDK packages
        run: android sdk install platforms/android-37.0 build-tools/37.0.0

      - name: Forecast benchmark unit tests
        run: python -m unittest discover -s research/forecast_benchmark/tests -v

      - name: GRIB capability unit tests
        run: python -m unittest discover -s research/grib_capabilities/tests -v

      - name: GRIB decoder candidate unit tests
        run: |
          bash -n research/grib_decoder_candidates/build_android_runtime_bundle.sh
          bash -n research/grib_decoder_candidates/run_android_runtime_smoke.sh
          python -m unittest discover -s research/grib_decoder_candidates/tests -v

      - name: Verify
        run: >-
          ./gradlew
          --no-daemon
          --stacktrace
          :core:model:test
          :core:location:testDebugUnitTest
          :core:location:lintDebug
          :forecast:domain:test
          :forecast:data:test
          :app:lintDebug
          :app:assembleDebug
          :app:bundleRelease
