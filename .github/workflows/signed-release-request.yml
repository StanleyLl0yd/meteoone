name: Signed Android Release Request

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dispatch:
    name: Dispatch signed GitHub release
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/build-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Dispatch canonical signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run signed-release-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
