name: Verify exact published APK native packaging (one-time)

on:
  push:
    branches:
      - ops/apk-native-verifier-probe-v040

permissions: {}

jobs:
  verify:
    if: github.repository == 'StanleyLl0yd/meteoone'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout verified native packaging policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py
      - name: Fetch unmodified signed release 0.4.0 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.4.0 --repo "$GITHUB_REPOSITORY" --pattern 'meteoone-0.4.0.apk'
          test "$(stat -c '%s' meteoone-0.4.0.apk)" = '45067705'
          echo '50859465c6b873f6fe1c72bd62b13eb6f0fd87f5c46fee8527e83d8ff7fcc2cd  meteoone-0.4.0.apk' | sha256sum --check --status
      - name: Verify actual APK native SHA, ELF ABI and 16 KiB alignment
        run: python3 -m scripts.verify_release_apk_native --apk meteoone-0.4.0.apk
