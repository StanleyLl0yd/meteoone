name: One-time exact-main Qodana verification

on:
  push:
    branches: [ops/qodana-final-20261125]

permissions: {}

jobs:
  qodana:
    name: Qodana
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a8bf5a575e37cd15c5c2f9210035c9715b27f009
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main checkout
        run: |
          test "$(git rev-parse HEAD)" = "a8bf5a575e37cd15c5c2f9210035c9715b27f009"
          test "$(git rev-parse HEAD^{tree})" = "8731bafd7c57b4eec1a72d741c4d022045def471"
          test -z "$(git status --porcelain)"

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Install Android SDK packages
        run: android sdk install platforms/android-37.1 build-tools/37.0.0

      - name: Prepare Gradle dependencies
        run: ./gradlew :app:dependencies --no-daemon --stacktrace

      - name: Prepare self-contained JDK for pinned Qodana container
        run: |
          # Hosted Temurin may link cacerts outside JAVA_HOME; preserve Java TLS trust.
          cp -aL "$JAVA_HOME" "$RUNNER_TEMP/qodana-jdk17"
          test -r "$RUNNER_TEMP/qodana-jdk17/lib/security/cacerts"

      - name: Run Qodana
        uses: JetBrains/qodana-action@aa698739cd4b8204ad53291bea7e16cd75da3c9f # v2026.3.1
        with:
          args: >-
            --image jetbrains/qodana-jvm-community@sha256:3db2bdb1d846ddeca9f600a6737bc82b3993067e07e572ba7bf791d9fe41a9bf
            --within-docker true
            --volume ${{ runner.temp }}/qodana-jdk17:/opt/meteoone-jdk17:ro
            --env JAVA_HOME=/opt/meteoone-jdk17
            --print-problems
          upload-result: true
          artifact-name: qodana-report
