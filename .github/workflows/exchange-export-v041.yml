name: Export MeteoOne 0.4.1 APK for Exchange

on:
  push:
    branches:
      - ops/exchange-export-v041

permissions:
  contents: read

jobs:
  transport:
    if: github.repository == 'StanleyLl0yd/meteoone'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Download and verify immutable 0.4.1 release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exchange"
          gh release download v0.4.1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'meteoone-0.4.1.apk' --dir "$RUNNER_TEMP/exchange"
          apk="$RUNNER_TEMP/exchange/meteoone-0.4.1.apk"
          test "$(stat -c '%s' "$apk")" = '45088177'
          echo "75c1d7e5e9645a1adf64c6c8da04645ba3c0a10f30b3583b789be62c2aa14963  $apk" | sha256sum -c
      - name: Upload APK for Exchange transfer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meteoone-v0.4.1-exchange
          path: ${{ runner.temp }}/exchange/meteoone-0.4.1.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
