name: One-time audited source snapshot
on:
  push:
    branches: [audit/repository-wide-20261009]
permissions: {}
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 72efc17fdca1a4f6035e785b928f79f6dade07a9
          persist-credentials: false
      - name: Verify and archive all tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "72efc17fdca1a4f6035e785b928f79f6dade07a9"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/meteoone-audit-source.tar.gz"
          sha256sum "$RUNNER_TEMP/meteoone-audit-source.tar.gz"
          du -h "$RUNNER_TEMP/meteoone-audit-source.tar.gz"
          cp "$RUNNER_TEMP/meteoone-audit-source.tar.gz" meteoone-audit-source.tar.gz
      - name: Upload temporary audit source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meteoone-audit-source-72efc17fdca1
          path: meteoone-audit-source.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
