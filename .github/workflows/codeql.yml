name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 2 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Kotlin 2.4.20 is newer than the current stable CodeQL extractor supports.
    # Keep automatic scans disabled until a real manual probe succeeds, then set
    # CODEQL_KOTLIN_SUPPORTED=true. workflow_dispatch remains the explicit probe.
    if: ${{ vars.CODEQL_KOTLIN_SUPPORTED == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Analyze Java/Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.1
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
          validate-wrappers: true

      - name: Install Android SDK packages
        run: android sdk install platforms/android-37.0 build-tools/37.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.0
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build for CodeQL
        run: >-
          ./gradlew
          --no-daemon
          --stacktrace
          --no-build-cache
          --no-configuration-cache
          --rerun-tasks
          :app:assembleDebug

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.0
