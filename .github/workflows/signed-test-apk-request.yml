name: Signed Android Test APK Request

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dispatch:
    name: Dispatch signed device-test APK build
    if: >-
      github.event.issue.number == 153 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/build-signed-test-apk'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Dispatch signed device-test APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run signed-test-apk.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
