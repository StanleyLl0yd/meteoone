name: Signed Android Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: meteoone-signed-android-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}

    steps:
      - name: Require canonical main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Verify release secret policy
        run: python3 scripts/verify_release_secret_policy.py

      - name: Validate release source and metadata
        id: metadata
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 scripts/verify_release_metadata.py

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from scripts.verify_release_metadata import parse_release_metadata

          metadata = parse_release_metadata(Path("app/build.gradle.kts").read_text(encoding="utf-8"))
          print(f"version_name={metadata.version_name}")
          print(f"version_code={metadata.version_code}")
          PY

          version_name="$(sed -n 's/^version_name=//p' "$GITHUB_OUTPUT" | tail -1)"
          test -n "$version_name"
          test -f "docs/release/$version_name.md"

      - name: Reject an existing version tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          set -euo pipefail
          tag="v$VERSION_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $tag" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Git tag already exists for $tag" >&2
            exit 1
          fi

      - name: Require successful main verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          required_workflows=("CI" "Security and Quality" "Secret Scan")

          for attempt in $(seq 1 40); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$release_sha&per_page=100")"
            pending=0

            for workflow in "${required_workflows[@]}"; do
              record="$(jq -c --arg name "$workflow" \
                '[.workflow_runs[] | select(.name == $name and .event == "push" and .head_branch == "main")] | sort_by(.created_at) | last // empty' \
                <<< "$runs")"

              if [[ -z "$record" ]]; then
                echo "$workflow: waiting for a main push run"
                pending=1
                continue
              fi

              status="$(jq -r '.status' <<< "$record")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$record")"
              run_url="$(jq -r '.html_url' <<< "$record")"

              if [[ "$status" != "completed" ]]; then
                echo "$workflow: $status ($run_url)"
                pending=1
              elif [[ "$conclusion" != "success" ]]; then
                echo "$workflow failed with conclusion '$conclusion': $run_url" >&2
                exit 1
              else
                echo "$workflow: success ($run_url)"
              fi
            done

            if (( pending == 0 )); then
              exit 0
            fi

            if (( attempt < 40 )); then
              sleep 15
            fi
          done

          echo "Timed out waiting for successful main verification on $release_sha." >&2
          exit 1

  build-sign-release:
    name: Build, verify and publish signed release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfirm canonical main before signing
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Verify release secret policy
        run: python3 scripts/verify_release_secret_policy.py

      - name: Verify exact release metadata
        run: >-
          python3 scripts/verify_release_metadata.py
          --expected-version-name "${{ needs.validate.outputs.version_name }}"
          --expected-version-code "${{ needs.validate.outputs.version_code }}"

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Install Android SDK packages
        run: android sdk install platforms/android-37.0 build-tools/37.0.0

      - name: Restore and validate release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_UPLOAD_CERT_SHA256"

          umask 077
          keystore_path="$RUNNER_TEMP/meteoone-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          test -s "$keystore_path"

          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          expected="$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          actual="$(keytool -list -v \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $NF; exit}' \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"

          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          [[ "$actual" =~ ^[0-9a-f]{64}$ ]]
          test "$actual" = "$expected"
          echo "Release signing certificate verified."

      - name: Build signed APK and AAB
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/meteoone-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew
          --no-daemon
          --stacktrace
          :app:assembleRelease
          :app:bundleRelease

      - name: Verify and stage APK and AAB
        id: package
        env:
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
          VERSION_NAME: ${{ needs.validate.outputs.version_name }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          source_aab="app/build/outputs/bundle/release/app-release.aab"
          mapping="app/build/outputs/mapping/release/mapping.txt"
          test -s "$source_apk"
          test -s "$source_aab"
          test -s "$mapping"

          aapt="$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          test -x "$aapt"
          test -x "$apksigner"

          package_line="$("$aapt" dump badging "$source_apk" | head -n 1)"
          package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$package_line")"
          package_version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$package_line")"
          package_version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$package_line")"
          test "$package_name" = "com.sl.meteoone"
          test "$package_version_code" = "$VERSION_CODE"
          test "$package_version_name" = "$VERSION_NAME"

          expected="$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"

          apk_report="$RUNNER_TEMP/apksigner-report.txt"
          "$apksigner" verify --verbose --print-certs "$source_apk" | tee "$apk_report"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$apk_report"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$apk_report"
          grep -F 'Number of signers: 1' "$apk_report"
          apk_fingerprint="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$apk_report" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$apk_fingerprint" = "$expected"

          aab_verification="$(jarsigner -verify "$source_aab" 2>&1)"
          grep -Fq 'jar verified.' <<< "$aab_verification"
          aab_fingerprint="$(keytool -printcert -jarfile "$source_aab" | awk -F': ' '/SHA256:/ {print $NF; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$aab_fingerprint" = "$expected"

          for native_lib in libaec.so libeccodes.so libmeteoone_grib_jni.so libsz.so; do
            unzip -Z1 "$source_apk" | grep -Fx "lib/arm64-v8a/$native_lib" >/dev/null
            unzip -Z1 "$source_aab" | grep -Fx "base/lib/arm64-v8a/$native_lib" >/dev/null
          done

          mkdir -p release
          apk_name="meteoone-$VERSION_NAME.apk"
          aab_name="meteoone-$VERSION_NAME.aab"
          cp "$source_apk" "release/$apk_name"
          cp "$source_aab" "release/$aab_name"

          echo "APK SHA-256: $(sha256sum "release/$apk_name" | cut -d' ' -f1)"
          echo "AAB SHA-256: $(sha256sum "release/$aab_name" | cut -d' ' -f1)"

          echo "apk_path=release/$apk_name" >> "$GITHUB_OUTPUT"
          echo "aab_path=release/$aab_name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK and AAB only
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.validate.outputs.version_name }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          AAB_PATH: ${{ steps.package.outputs.aab_path }}
        run: |
          set -euo pipefail
          tag="v$VERSION_NAME"
          args=(
            gh release create "$tag"
            "$APK_PATH"
            "$AAB_PATH"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "MeteoOne $VERSION_NAME"
            --notes-file "docs/release/$VERSION_NAME.md"
          )
          if [[ "$VERSION_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          "${args[@]}"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/meteoone-release.jks"
