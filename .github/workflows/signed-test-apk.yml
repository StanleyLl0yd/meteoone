name: Signed Android Test APK

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: meteoone-signed-android-test-apk
  cancel-in-progress: false

env:
  RELEASE_SOURCE_SHA: ae27269aa753ebcd812922b5023d5f6854810df9
  VERSION_NAME: 0.1.0-alpha.1
  VERSION_CODE: "1"

jobs:
  build-sign-test-apk:
    name: Build and verify signed device-test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Check out frozen alpha source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen source and release policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          python3 scripts/verify_ci_supply_chain.py
          python3 scripts/verify_release_secret_policy.py
          python3 scripts/verify_release_metadata.py \
            --expected-version-name "$VERSION_NAME" \
            --expected-version-code "$VERSION_CODE"

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Install Android SDK packages
        run: android sdk install platforms/android-37.0 build-tools/37.0.0

      - name: Restore and validate signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_UPLOAD_CERT_SHA256"

          umask 077
          keystore_path="$RUNNER_TEMP/meteoone-device-test.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          test -s "$keystore_path"

          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          expected="$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          actual="$(keytool -list -v \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $NF; exit}' \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')"

          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          [[ "$actual" =~ ^[0-9a-f]{64}$ ]]
          test "$actual" = "$expected"
          echo "Signing certificate SHA-256 verified: $actual"

      - name: Build signed release APK
        env:
          REQUIRE_RELEASE_SIGNING: "true"
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/meteoone-device-test.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew
          --no-daemon
          --stacktrace
          :app:assembleRelease

      - name: Verify and stage device-test APK
        env:
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$source_apk"

          aapt="$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          test -x "$aapt"
          test -x "$apksigner"

          package_line="$("$aapt" dump badging "$source_apk" | head -n 1)"
          package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$package_line")"
          package_version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$package_line")"
          package_version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$package_line")"
          test "$package_name" = "com.sl.meteoone"
          test "$package_version_code" = "$VERSION_CODE"
          test "$package_version_name" = "$VERSION_NAME"

          expected="$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          apk_report="$RUNNER_TEMP/apksigner-device-test.txt"
          "$apksigner" verify --verbose --print-certs "$source_apk" | tee "$apk_report"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$apk_report"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$apk_report"
          grep -F 'Number of signers: 1' "$apk_report"
          apk_fingerprint="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$apk_report" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$apk_fingerprint" = "$expected"

          for native_lib in libaec.so libeccodes.so libmeteoone_grib_jni.so libsz.so; do
            unzip -Z1 "$source_apk" | grep -Fx "lib/arm64-v8a/$native_lib" >/dev/null
          done

          mkdir -p device-test
          apk_name="meteoone-$VERSION_NAME-device-test.apk"
          provenance_name="meteoone-$VERSION_NAME-device-test-build.txt"
          cp "$source_apk" "device-test/$apk_name"
          {
            echo "purpose=device-functional-test"
            echo "not_rustore_delivered_apk=true"
            echo "release_source_sha=$RELEASE_SOURCE_SHA"
            echo "workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "application_id=com.sl.meteoone"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "signing_certificate_sha256=$expected"
          } > "device-test/$provenance_name"

          python3 scripts/write_sha256_manifest.py \
            "device-test/$apk_name" \
            "device-test/$provenance_name" \
            --output device-test/SHA256SUMS

          (
            cd device-test
            sha256sum --check SHA256SUMS
          )

      - name: Upload signed APK for direct device testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meteoone-${{ env.VERSION_NAME }}-device-test-apk
          path: |
            device-test/meteoone-${{ env.VERSION_NAME }}-device-test.apk
            device-test/meteoone-${{ env.VERSION_NAME }}-device-test-build.txt
            device-test/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/meteoone-device-test.jks"
