name: One-time restore Dependabot labels

on:
  push:
    branches: [ops/dependabot-labels-restore]

permissions:
  issues: write

jobs:
  labels:
    if: github.repository == 'StanleyLl0yd/meteoone'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create missing metadata labels only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in dependencies github-actions; do
            if gh api "/repos/$GITHUB_REPOSITORY/labels/$name" >/dev/null 2>&1; then
              echo "Already exists: $name"
              continue
            fi
            if [[ "$name" == "dependencies" ]]; then
              color=0366d6
              description="Dependabot and dependency maintenance"
            else
              color=fef2c0
              description="GitHub Actions automation"
            fi
            gh api -X POST "/repos/$GITHUB_REPOSITORY/labels" \
              -f name="$name" -f color="$color" -f description="$description"
            echo "Created: $name"
          done
